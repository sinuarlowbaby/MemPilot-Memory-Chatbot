services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0_qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"   # REST API  (matches QDRANT_URL in .env)
      - "6334:6334"   # gRPC
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT__SERVICE__API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: mem0_redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # matches REDIS_URL in .env
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis
  neo4j:
    image: neo4j:5-community
    container_name: mem0_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser Console
      - "7687:7687"   # Bolt Port (used for programmatic connection)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
  
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse_server
    restart: unless-stopped
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=a_very_secure_secret_phrase
      - SALT=a_very_secure_salt_phrase
      - TELEMETRY_ENABLED=false


volumes:
  qdrant_data:
  redis_data:
  redis-insight-data:
  neo4j_data:
  langfuse_db_data: 
